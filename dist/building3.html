<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Building 3</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        background: #783cff;
        overflow: hidden;
      }

      .scene {
        position: fixed;
        top: 50%;
        left: 50%;
        width: 1920px;
        height: 1080px;
        transform: translate(-50%, -50%) scale(min(calc(100vw / 1920px), calc(100vh / 1080px)));
        transform-origin: center;
      }

      .building {
        display: block;
        width: 1920px;
        height: 1080px;
      }

      .globe {
        position: absolute;
        top: 106px;
        left: 1044px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
      }

      @property --stripe-reveal {
        syntax: '<percentage>';
        inherits: false;
        initial-value: 0%;
      }

      .billboard {
        position: absolute;
        top: 796.5px;
        left: 742.5px;
        width: 54px;
        height: 90px;
        overflow: hidden;
        transform: skewY(-11.4deg);
        transform-origin: top left;
        filter: brightness(0.82) saturate(0.9);
      }

      .billboard-image {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        -o-object-fit: cover;
           object-fit: cover;
      }

      .billboard-image-next {
        --stripe-reveal: 0%;
        -webkit-mask-image: repeating-linear-gradient(
          to right,
          #000 0 var(--stripe-reveal),
          transparent var(--stripe-reveal) 8.333%
        );
        mask-image: repeating-linear-gradient(
          to right,
          #000 0 var(--stripe-reveal),
          transparent var(--stripe-reveal) 8.333%
        );
        animation: billboard-swap 8s ease-in-out infinite;
      }

      .billboard::after {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: repeating-linear-gradient(
          to right,
          transparent 0 calc(8.333% - 1px),
          rgb(21 21 74 / 22%) calc(8.333% - 1px) 8.333%
        );
      }

      @keyframes billboard-swap {
        0%, 35% {
          --stripe-reveal: 0%;
        }
        45%, 85% {
          --stripe-reveal: 8.333%;
        }
        95%, 100% {
          --stripe-reveal: 0%;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <img class="building" src="/img/buildings/building3.png" alt="Building 3" />
      <canvas class="globe" width="140" height="140" aria-label="Rotating globe"></canvas>
      <div class="billboard" aria-label="Animated billboard">
        <img class="billboard-image" src="/board1.jpg" alt="" />
        <img class="billboard-image billboard-image-next" src="/board2.jpg" alt="" />
      </div>
    </div>

    <script>
      const globe = document.querySelector('.globe');
      const context = globe.getContext('2d');
      const sprite = new Image();
      const columns = 5;
      const frameCount = 25;
      const frameDuration = 1000 / 12;
      const sourceFrameWidth = 1536 / columns;
      const sourceFrameHeight = 1024 / columns;
      const sourceGlobeSize = 184;
      const frameCenters = [
        [177.5, 105], [164.5, 105], [152, 105], [141.5, 104], [131, 104],
        [177.5, 110], [164.5, 110], [152.5, 109.5], [141.5, 107.5], [132, 107.5],
        [177.5, 108.5], [164.5, 108.5], [152, 108.5], [141, 108.5], [131, 110.5],
        [177.5, 110], [164.5, 110.5], [152, 110], [141, 110.5], [131, 110.5],
        [176, 110], [164, 110.5], [152, 110], [141, 110], [130.5, 110],
      ];
      let lastFrameTime = 0;
      let frame = 0;

      function drawFrame() {
        const column = frame % columns;
        const row = Math.floor(frame / columns);
        const [centerX, centerY] = frameCenters[frame];

        context.clearRect(0, 0, globe.width, globe.height);
        context.drawImage(
          sprite,
          column * sourceFrameWidth + centerX - sourceGlobeSize / 2,
          row * sourceFrameHeight + centerY - sourceGlobeSize / 2,
          sourceGlobeSize,
          sourceGlobeSize,
          0,
          0,
          globe.width,
          globe.height,
        );
      }

      function animate(time) {
        if (time - lastFrameTime >= frameDuration) {
          frame = (frame + 1) % frameCount;
          lastFrameTime = time;
          drawFrame();
        }

        requestAnimationFrame(animate);
      }

      sprite.addEventListener('load', () => {
        drawFrame();
        requestAnimationFrame(animate);
      });
      sprite.src = '/globe.png';
    </script>
  </body>
</html>
