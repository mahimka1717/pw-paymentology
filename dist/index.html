<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Asset paths are relative, so the game must be opened as /folder/ (with the trailing slash), not /folder.
      if (!/(\/|\.html?)$/.test(location.pathname)) {
        location.replace(location.pathname + '/' + location.search + location.hash);
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#783cff" />
    <!-- Google Analytics 4 Measurement ID (G-XXXXXXXXXX). Empty = no analytics. See ANALYTICS.md. -->
    <meta name="ga-measurement-id" content="" />
    <meta name="description" content="Can you build a successful card programme? Play the Issuer Challenge and discover what your choices reveal about your decision-making style." />
    <title>The Issuer Challenge | Paymentology</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Paymentology" />
    <meta property="og:title" content="The Issuer Challenge" />
    <meta property="og:description" content="Can you build a successful card programme? Play the Issuer Challenge and discover what your choices reveal about your decision-making style." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- og:image (og.jpg, 1200×630), og:url and canonical need the final absolute URL: added on the hub, see README. -->
    <link rel="icon" href="./favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="./favicon.png" />

    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>

    <!-- The city is the first thing on screen: start loading it with the scripts, not after them. Keep in sync with InteractiveCity. -->
    <link rel="preload" as="image" href="./img/city/city-900.webp" imagesrcset="img/city/city-900.webp 900w, img/city/city-1800.webp 1800w" imagesizes="(min-width: 1025px) 900px, 100vw" fetchpriority="high">

    <link rel="preload" href="./fonts/subset-PPMonumentWide-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/subset-PPMonumentWide-Black.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/subset-PPMonumentExtended-Black.woff2" as="font" type="font/woff2" crossorigin>
    <script type="module" crossorigin src="./assets/index-DyWWcFOt.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DURfuYmm.css">

  <body class="min-h-screen text-white antialiased" data-screen="select">

      <svg width="64" height="64" viewBox="0 0 64 64" fill="none" aria-hidden="true">

      <p class="rotate-notice-title">Please rotate your device</p>
      <p class="rotate-notice-text">The Issuer Challenge is played in portrait mode.</p>
    </div>
    <noscript>
      <p style="margin: 0; padding: 40vh 24px 0; font: 18px/1.5 Inter, Arial, sans-serif; text-align: center; color: #fff;">
